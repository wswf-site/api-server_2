services:
  api-server:
    image: ${ECR_REGISTRY_URL}:latest
    ports:
      - ${API_SERVER_PORT}
    restart: always
    env_file:
      - ./.env
    depends_on:
      my-cache-server:
        condition: service_healthy

  my-cache-server:
    image: redis
    ports:
      - ${REDIS_SERVER_PORT}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping" ]
      interval: 5s
      timeout: 15s
      retries: 6